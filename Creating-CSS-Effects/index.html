<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creating Effects with CSS</title>

     <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!--NAVBAR-->
        <nav class="nav-bar">
            <ul>
                <li><a href="#">Home</a></li>
                <li class="drop">
                    <a href="#">images</a>
                    <div class="rollover-menu">
                        <a href="#image1">Image 1</a>
                        <a href="#image2">Image 2</a>
                        <a href="#image3">Image 3</a>
                    </div>
                </li>
            </ul>
        </nav>

        <!--Images-->
        <section>
            <!--image 1-->
            <div id="image1" class="image-container">
                <img src="images/ca2.jpg" alt="Image 1">
               <div class="overlay"></div>
            </div>
            <!--image 2-->
            <div id="image2" class="image-container">
                <img src="images/ca3.jpg" alt="Image 2" class="zoom">
               
            </div>
            <!--image 3-->
            <div id="image3" class="image-container">
                <div class="circle">
                <img src="images/ca4.jpg" alt="Image 3">
                </div>
            </div>
        </section>
    <footer>
        <div class="footer-text">
            <p>The Tech Academy &copy;</p>
        </div>
    </footer>
</body>
</html>
