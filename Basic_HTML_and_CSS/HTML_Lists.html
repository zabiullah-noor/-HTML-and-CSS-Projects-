<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML Lists</title>
	<link rel="stylesheet" type="text/css" href="CSS_Lists.css">
</head>

<body>

    <h1>My Lists Example</h1>

    <!-- Unordered List -->
    <h2>Unordered List (Hobbies)</h2>
    <ul>
        <li>Reading</li>
        <li>Gaming</li>
        <li>Traveling</li>
        <li>Cooking</li>
    </ul>

    <!-- Ordered List -->
    <h2>Ordered List (Daily Routine)</h2>
    <ol>
        <li>Wake up</li>
        <li>Brush teeth</li>
        <li>Go to work/school</li>
        <li>Study HTML</li>
    </ol>

</body>
</html>
