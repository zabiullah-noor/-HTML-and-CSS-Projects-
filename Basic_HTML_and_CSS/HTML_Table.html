<!DOCTYPE html>
<html lang="en"><link rel="stylesheet" type="text/css" href="CSS_Table.css">
<head>
    <title>HTML Table</title>
	<link rel="stylesheet" type="text/css" href="CSS_Table.css">
</head>

<body>

    <h1>My Simple Table</h1>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>

        <tr>
            <td>Ali</td>
            <td>25</td>
            <td>Toronto</td>
        </tr>

        <tr>
            <td>Sara</td>
            <td>22</td>
            <td>Mississauga</td>
        </tr>

        <tr>
            <td>John</td>
            <td>30</td>
            <td>Vancouver</td>
        </tr>
    </table>

</body>
</html>
